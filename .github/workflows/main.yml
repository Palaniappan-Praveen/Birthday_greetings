name: Daily Birthday Wisher

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository content
        uses: actions/checkout@v4.1.1  # ← Updated from @v4

      - name: Setup Python
        uses: actions/setup-python@v5.1.0  # ← Updated from @v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas

      - name: Execute Python script
        env:
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          MY_PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          python main.py
          if [ $? -ne 0 ]; then
            exit 1
          fi
